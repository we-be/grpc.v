// the etcd-lite dogfood schema: unary get/put, server-streaming scan,
// client-streaming put_many
syntax = "proto3";

package kv;

option go_package = "example.com/kvserver/kv";

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool replaced = 1;
}

message PutManyResponse {
  int32 written = 1;
}

service KV {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Put (PutRequest) returns (PutResponse);
  rpc Scan (GetRequest) returns (stream GetResponse);
  rpc PutMany (stream PutRequest) returns (PutManyResponse);
}
