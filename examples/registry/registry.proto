// registry: a Connect service that showcases protobuf.v's newer features
// in one place — a consul/etcd-flavored tree of service nodes. Each node
// carries labels (a map), when it registered and its TTL (well-known
// Timestamp/Duration), an opaque typed payload (Any), a health status
// (an allow_alias enum), its children (recursion), and the leader among
// them (singular recursion). All wire + JSON + gRPC glue is generated by
//   vpbgen -m main -json -o registry_pb.v -grpc registry_grpc.v registry.proto
syntax = "proto3";

package registry;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/any.proto";

// Health of a node. allow_alias lets two names share a number; the first
// (canonical) name wins on encode.
enum Health {
  option allow_alias = true;
  HEALTH_UNKNOWN = 0;
  HEALTH_PASSING = 1;
  HEALTH_OK = 1; // alias of PASSING
  HEALTH_CRITICAL = 2;
}

message Node {
  string name = 1;
  Health health = 2;
  map<string, string> meta = 3; // arbitrary labels
  google.protobuf.Timestamp registered = 4; // WKT: RFC-3339 in JSON
  google.protobuf.Duration ttl = 5; // WKT: "30s" in JSON
  google.protobuf.Any detail = 6; // opaque, type-tagged payload
  repeated Node children = 7; // recursion (repeated)
  Node leader = 8; // recursion (singular -> ?&Node), the primary child
}

message PutRequest {
  Node root = 1;
}

message PutResponse {
  int32 nodes = 1; // number of nodes stored (whole subtree)
}

message GetRequest {
  string path = 1; // top-level node name; "" is not found
}

message GetResponse {
  Node node = 1;
  bool found = 2;
}

service Registry {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
}
